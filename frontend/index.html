<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items Manager - Microservice DevOps Lab</title>
    <link rel="stylesheet" href="user-styles.css?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-box"></i>
                <h1>Items Manager</h1>
                <p>Microservice DevOps Lab</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input type="text" id="username" name="username" value="testuser" required>
                </div>
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="password" name="password" value="User123!" required>
                </div>
                <div class="form-group">
                    <label for="apiUrl">
                        <i class="fas fa-server"></i> API URL
                    </label>
                    <input type="text" id="apiUrl" name="apiUrl" value="http://localhost:8000" required>
                </div>
                <div id="loginError" class="error-message" style="display: none;"></div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            <div class="admin-link">
                <a href="/admin/">
                    <i class="fas fa-user-shield"></i> Admin Dashboard
                </a>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="appScreen" class="app-container" style="display: none;">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <i class="fas fa-box"></i>
                <h1>Items Manager</h1>
            </div>
            <div class="header-right">
                <button id="cartBtn" class="btn btn-info cart-btn" onclick="openCartModal()">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cartCount" class="cart-badge">0</span>
                </button>
                <span id="userInfo" class="user-info"></span>
                <button id="logoutBtn" class="btn btn-secondary">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main">
            <!-- Stats Section -->
            <div class="stats-section">
                <div class="stat-card">
                    <div class="stat-icon blue">
                        <i class="fas fa-box"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-label">Total Items</div>
                        <div class="stat-value" id="totalItems">0</div>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon green">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-label">Active Items</div>
                        <div class="stat-value" id="activeItems">0</div>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon purple">
                        <i class="fas fa-tags"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-label">Categories</div>
                        <div class="stat-value" id="categoriesCount">0</div>
                    </div>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="itemSearch" placeholder="Search items...">
                </div>
                <div class="filters">
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                    </select>
                    <label>
                        <input type="checkbox" id="activeOnlyFilter" checked> Active Only
                    </label>
                </div>
                <button class="btn btn-primary" onclick="showCreateItemModal()">
                    <i class="fas fa-plus"></i> Add Item
                </button>
                <button class="btn btn-success" onclick="loadItems()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>

            <!-- Items Grid -->
            <div id="itemsGrid" class="items-grid">
                <div class="loading-message">Loading items...</div>
            </div>
        </main>
    </div>

    <!-- Create/Edit Item Modal -->
    <div id="itemModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle"><i class="fas fa-box"></i> Add Item</h3>
                <span class="close" onclick="closeItemModal()">&times;</span>
            </div>
            <form id="itemForm">
                <div class="modal-body">
                    <input type="hidden" id="itemId">
                    
                    <div class="form-group">
                        <label for="itemName">Item Name *</label>
                        <input type="text" id="itemName" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="itemDescription">Description</label>
                        <textarea id="itemDescription" rows="3"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="itemPrice">Price *</label>
                        <input type="number" id="itemPrice" step="0.01" min="0" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="itemCategory">Category *</label>
                        <input type="text" id="itemCategory" required>
                    </div>
                    
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="itemActive" checked> Active
                        </label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeItemModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- View Item Details Modal -->
    <div id="viewItemModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-box"></i> Item Details</h3>
                <span class="close" onclick="closeViewItemModal()">&times;</span>
            </div>
            <div class="modal-body" id="viewItemBody">
                Loading...
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeViewItemModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Shopping Cart Modal -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-shopping-cart"></i> Shopping Cart</h3>
                <span class="close" onclick="closeCartModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div id="cartItems" class="cart-items-list">
                    <!-- Cart items will be inserted here -->
                </div>
                <div class="cart-summary">
                    <div class="cart-total">
                        <span>Total:</span>
                        <span id="cartTotal" class="cart-total-amount">$0.00</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="clearCart()">
                    <i class="fas fa-trash"></i> Clear Cart
                </button>
                <button class="btn btn-secondary" onclick="closeCartModal()">Close</button>
                <button class="btn btn-success" onclick="placeOrder()">
                    <i class="fas fa-check"></i> Place Order
                </button>
            </div>
        </div>
    </div>

    <script src="user-app.js?v=3"></script>
</body>
</html>
